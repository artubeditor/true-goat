name: Build Kotoba Whisper + DeepL JP-KO APK

on:
  workflow_dispatch:
  push:
    branches:
      - jpko-kotoba-deepl-v2
    paths:
      - 'jpko-kotoba-deepl-v2-source.zip'
      - '.github/workflows/build-jpko-kotoba-deepl-v2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          mkdir -p .build
          echo '0d08584bf5fab1ff80e1a0dc22cdcc4c9f2ce660c55e9cc3cec1e61ec11bf8b5  jpko-kotoba-deepl-v2-source.zip' | sha256sum -c -
          unzip -q jpko-kotoba-deepl-v2-source.zip -d .build
          test -f .build/jpko-live-subtitle/app/build.gradle

      - name: Test and build APK
        working-directory: .build/jpko-live-subtitle
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain testDebugUnitTest assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp .build/jpko-live-subtitle/app/build/outputs/apk/debug/app-debug.apk dist/Japanese-Korean-Live-Subtitle-Kotoba-DeepL-v2-debug.apk
          sha256sum dist/Japanese-Korean-Live-Subtitle-Kotoba-DeepL-v2-debug.apk | tee dist/SHA256SUMS.txt
          unzip -t dist/Japanese-Korean-Live-Subtitle-Kotoba-DeepL-v2-debug.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Japanese-Korean-Live-Subtitle-Kotoba-DeepL-v2-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Japanese-Korean-Live-Subtitle-Kotoba-DeepL-v2-debug.apk | tee dist/APK-BADGING.txt
          grep -q "versionName='2.0.0-debug'" dist/APK-BADGING.txt
          grep -q "package: name='ai.capedia.jpko.debug'" dist/APK-BADGING.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Japanese-Korean-Live-Subtitle-Kotoba-DeepL-v2
          path: |
            dist/Japanese-Korean-Live-Subtitle-Kotoba-DeepL-v2-debug.apk
            dist/SHA256SUMS.txt
            dist/APK-BADGING.txt
          retention-days: 7
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='jpko-kotoba-deepl-v2.0.0'
          gh release delete "$TAG" --yes >/dev/null 2>&1 || true
          git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true
          HASH="$(cut -d' ' -f1 dist/SHA256SUMS.txt)"
          gh release create "$TAG" \
            dist/Japanese-Korean-Live-Subtitle-Kotoba-DeepL-v2-debug.apk \
            dist/SHA256SUMS.txt \
            --title 'Japanese → Korean Live Subtitle — Kotoba + DeepL v2.0.0' \
            --notes "Kotoba-Whisper v2.0 Q5 Japanese ASR + DeepL quality_optimized Korean translation. Previous 4 Japanese subtitle lines are sent as DeepL context. DeepL API key is entered by the user and encrypted with Android Keystore for this personal debug build. SHA-256: $HASH"
