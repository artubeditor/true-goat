name: Build Japanese-Korean Live Subtitle APK

on:
  workflow_dispatch:
  push:
    branches:
      - jpko-apk-transfer
    paths:
      - '.github/workflows/build-jpko-public-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and verify project source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/git/blobs/9f90b87aff96e14cc2a195440cb4b0303cb70f54" \
            --jq '.content' | tr -d '\n' | base64 --decode > /tmp/jpko-live-subtitle-source.zip
          echo "b03296325900958356b394460fe2efe56ae324b580f321d5b151cad6c07cfb8e  /tmp/jpko-live-subtitle-source.zip" | sha256sum -c -
          unzip -t /tmp/jpko-live-subtitle-source.zip
          rm -rf .build
          mkdir -p .build
          unzip -q /tmp/jpko-live-subtitle-source.zip -d .build
          test -f .build/jpko-live-subtitle/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build APK
        working-directory: .build/jpko-live-subtitle
        shell: bash
        run: gradle --no-daemon --console=plain testDebugUnitTest assembleDebug --stacktrace

      - name: Verify installable APK
        shell: bash
        run: |
          set -euo pipefail
          APK=.build/jpko-live-subtitle/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Publish APK to this public branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-apk
          cp .build/jpko-live-subtitle/app/build/outputs/apk/debug/app-debug.apk public-apk/Japanese-Korean-Live-Subtitle.apk
          sha256sum public-apk/Japanese-Korean-Live-Subtitle.apk > public-apk/SHA256SUMS.txt
          cat > public-apk/INSTALL.txt <<'TXT'
          Japanese-Korean Live Subtitle — debug test build

          1. Install on Android 10 or later.
          2. Allow notification, audio capture, screen capture, and display-over-other-apps permissions.
          3. Open the app and download the required local models.
          4. Start subtitles and approve Android's screen/audio sharing dialog.
          5. Play Japanese speech in YouTube or another compatible app.

          Some apps block internal audio capture or overlays. The app does not bypass DRM or platform restrictions.
          TXT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-apk
          git commit -m "Publish Japanese-Korean Live Subtitle APK"
          git push origin HEAD:jpko-apk-transfer
